<!DOCTYPE html>

  <title>Page not found | Chainnes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/chainnes-logo-day.png">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("chainnes-theme");
        var theme = stored === "day" || stored === "night"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day");
        document.documentElement.setAttribute("data-theme", theme);
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.href = theme === "night" ? "/assets/images/chainnes-logo.png" : "/assets/images/chainnes-logo-day.png";
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "day");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
