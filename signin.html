<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | CHAINNE</title>
  <meta name="description" content="Sign in to CHAINNE to access your workspace, subscriptions, and automation tools." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #07111f; color: #f3f4f6; }
    .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px); }
  </style>
</head>
<body class="bg-grid min-h-screen flex items-center justify-center px-6 py-16 antialiased">
  <div class="w-full max-w-md rounded-3xl border border-gray-800 bg-gray-950/70 p-8 shadow-2xl shadow-cyan-950/20">
    <div class="flex items-center gap-3 mb-8">
      <img src="assets/chainne-logo.svg" alt="CHAINNE logo" class="w-10 h-10" />
      <div>
        <p class="text-xs font-mono uppercase tracking-[0.3em] text-cyan-400">CHAINNE</p>
        <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      </div>
    </div>

    <form class="space-y-4">
      <div>
        <label class="text-sm text-gray-400">Email</label>
        <input type="email" class="mt-2 w-full rounded-xl border border-gray-800 bg-gray-900 px-4 py-3 text-white" placeholder="you@company.com" />
      </div>
      <div>
        <label class="text-sm text-gray-400">Password</label>
        <input type="password" class="mt-2 w-full rounded-xl border border-gray-800 bg-gray-900 px-4 py-3 text-white" placeholder="••••••••" />
      </div>
      <button class="w-full rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 px-4 py-3 font-semibold text-white">Sign in</button>
    </form>

    <p class="text-sm text-gray-500 mt-6">Need an account? <a href="signup.html" class="text-cyan-400">Create one</a></p>
  </div>
</body>
</html>
